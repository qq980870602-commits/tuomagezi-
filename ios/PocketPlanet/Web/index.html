<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2b8bd"><title>口袋星球 · 电子宠物机</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf5ed;color:#554e63;font:15px system-ui,-apple-system,sans-serif;background-image:radial-gradient(#d8cfc5 1px,transparent 1px);background-size:22px 22px}button{font:inherit;cursor:pointer;border:0}header{max-width:1080px;margin:auto;padding:26px 24px;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0;letter-spacing:2px}small{color:#918699}main{max-width:1000px;margin:15px auto 40px;display:grid;grid-template-columns:1fr 340px;gap:65px;align-items:center;padding:0 24px}.intro{font-size:11px;letter-spacing:4px;color:#9c8096}.title{font-size:36px;margin:8px 0 14px;font-weight:800}.machine{width:360px;max-width:100%;margin:auto;background:linear-gradient(135deg,#ffd5d4,#eaa1b5);border-radius:47% 47% 43% 43% / 42% 42% 57% 57%;padding:44px 29px 32px;box-shadow:inset 8px 8px 0 #ffe7e278,inset -8px -9px 0 #ce839f70,0 22px 38px #ad859d26;border:2px solid #efb3bd;position:relative}.brand{text-align:center;font-size:12px;letter-spacing:4px;color:#a75e82;font-weight:800;margin:0 0 19px}.screen{background:#fdf5e4;border:10px solid #8b83a3;border-radius:26px;overflow:hidden;box-shadow:0 0 0 5px #f5d5cd;height:294px}.screenhead{padding:10px 12px;display:flex;justify-content:space-between;font-size:11px;background:#fff9ef}.room{height:180px;position:relative;display:flex;justify-content:center;align-items:flex-end;padding-bottom:28px;background:linear-gradient(#d9eee6 0 72%,#f0d6b4 72%);overflow:hidden}.window{position:absolute;top:20px;left:24px;width:54px;height:61px;background:linear-gradient(#a8d9ee,#ecf8ee);border:6px solid #fff9ea;border-radius:20px 20px 4px 4px}.window:after{content:'✦';color:#ffdc8e;position:absolute;left:15px;top:7px}.plant{position:absolute;right:13px;bottom:39px;font-size:36px}.pet{font-size:78px;line-height:1.2;filter:drop-shadow(0 6px 0 #80695b20);user-select:none;cursor:pointer;animation:bob 2s ease-in-out infinite}.pet.sleep{animation:none;opacity:.7}.bubble{position:absolute;top:12px;right:9px;font-size:11px;background:white;border-radius:12px;padding:7px;max-width:130px}.floor{position:absolute;bottom:7px;left:16px;font-size:20px}.message{padding:10px;font-size:12px;text-align:center;min-height:43px;background:#fff9ed}.controls{display:flex;justify-content:center;gap:22px;padding:24px 0 3px}.hardware{background:#9ed6c4;border:2px solid #73b2a4;box-shadow:0 5px 0 #bc7d99;width:46px;height:46px;border-radius:50%;color:#50776e;font-weight:bold}.hardware:active{transform:translateY(3px);box-shadow:0 2px 0 #bc7d99}.hardware span{display:block;font-size:9px}.hint{text-align:center;font-size:10px;color:#ac6e87;margin-top:13px;letter-spacing:2px}.panel{background:#fffdf8;border:1px solid #e9dfd5;border-radius:24px;padding:24px;box-shadow:0 12px 30px #a98e7110}.petname{display:flex;justify-content:space-between;align-items:center}.petname h2{margin:0;font-size:24px}.pill{border-radius:20px;background:#eee8f4;color:#8a749f;padding:5px 10px;font-size:11px}.sub{font-size:12px;color:#9d929a;margin:9px 0 23px}.stat{margin:13px 0}.statline{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.track{height:7px;background:#f1ece5;border-radius:9px;overflow:hidden}.fill{height:100%;border-radius:9px;transition:width .4s}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px}.action{background:#f7f1e9;border-radius:13px;padding:12px 0;color:#6c6070;font-size:12px}.action b{display:block;font-size:24px;margin-bottom:5px}.action:hover{background:#f5e1e7}.action:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:8px;margin:24px 0 12px}.tabs button{background:none;color:#a092a0;padding:7px 9px;font-size:12px}.tabs .active{color:#976e90;background:#f4eaf1;border-radius:12px}.progress{font-size:12px;line-height:1.8;color:#968596}.evolution{display:flex;justify-content:space-between;text-align:center;margin-top:14px}.evolution span{font-size:26px;filter:grayscale(1);opacity:.4}.evolution .unlocked{filter:none;opacity:1}.evolution small{display:block;font-size:10px;margin-top:5px}.footer{text-align:center;color:#a59aa3;font-size:11px;margin:24px}dialog{border:1px solid #e7d6df;border-radius:24px;padding:26px;width:340px;max-width:90vw;color:#66576c;text-align:center;background:#fffaf3}dialog::backdrop{background:#55445b66}.catch{height:220px;position:relative;background:#e1eee6;border-radius:14px;overflow:hidden}.target{position:absolute;background:none;font-size:36px;padding:8px}.close{background:#c49ab7;color:white;border-radius:14px;padding:10px 25px;margin-top:15px}@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}@media(max-width:760px){header{padding:20px}main{grid-template-columns:1fr;gap:28px;margin-top:0}.intro,.title{text-align:center}.title{font-size:28px}.machine{width:330px;padding:35px 26px 25px}.screen{height:279px}.room{height:165px}.panel{max-width:390px;width:100%;margin:auto}.footer{line-height:1.8}}
</style></head><body><header><h1>✦ 口袋星球</h1><small>慢慢养大，一起长大</small></header><main><section><div class="intro">YOUR LITTLE POCKET FRIEND</div><div class="title">一颗蛋，一段小小陪伴。</div><div class="machine"><div class="brand">POCKET PLANET</div><div class="screen"><div class="screenhead"><span id="clock"></span><span id="coins"></span></div><div class="room"><div class="window"></div><div class="plant">🪴</div><div class="bubble" id="bubble">你好呀，小主人！</div><div class="pet" id="pet" role="button" tabindex="0" aria-label="摸摸宠物">🥚</div><div class="floor" id="dirt"></div></div><div class="message" id="message" aria-live="polite">轻轻摸摸蛋，和它打个招呼吧。</div></div><div class="controls"><button class="hardware" id="prev" aria-label="上一个功能">◀</button><button class="hardware" id="confirm" aria-label="确认功能">●<span>确认</span></button><button class="hardware" id="next" aria-label="下一个功能">▶</button></div><div class="hint" id="selection">喂食 · 按中键使用</div></div></section><aside class="panel"><div class="petname"><h2 id="name">小星</h2><button class="pill" id="rename">改名 ✎</button></div><div class="sub" id="age"></div><div id="stats"></div><div class="actions" id="actions"></div><div class="tabs"><button class="active" id="tabGrowth">成长手册</button><button id="tabBook">进化图鉴</button></div><div id="detail" class="progress"></div><div class="evolution" id="evolution"></div></aside></main><div class="footer">原创电子宠物 · 进度自动保存在当前浏览器<br>离线最多结算 8 小时，记得回来看看它。</div><dialog id="game"><h2>接住小星星 ✨</h2><p id="gameinfo">15 秒内点中星星，陪宠物玩一会儿。</p><div class="catch" id="field"><button class="target" id="target" aria-label="接星星">⭐</button></div><button class="close" id="gameClose">结束游戏</button></dialog><script>
const KEY='pocket-planet-v1', defaults={name:'小星',food:85,joy:80,clean:90,energy:90,xp:0,coins:30,feeds:0,plays:0,sleeps:0,born:Date.now(),last:Date.now(),sleeping:false,form:null,book:[],taps:0};let s;try{s={...defaults,...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{s={...defaults}}let selected=0,tab='growth',timer=null,score=0,remaining=15;const $=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(100,v));const config=[['food','饱腹','🍙','#e5b975'],['joy','心情','💗','#dda1b6'],['clean','清洁','🫧','#8cbfbf'],['energy','精力','🌙','#b3a0d0']];const acts=[['🍙','喂食'],['🫧','洗澡'],['⭐','玩耍'],['🌙','睡觉'],['💊','照料'],['💕','摸摸']];function stage(){return s.xp<5?0:s.xp<45?1:s.xp<120?2:3}function evolve(){if(stage()===3&&!s.form){s.form=s.plays>s.feeds&&s.plays>s.sleeps?'🦊':s.sleeps>s.feeds?'🦉':'🐱';if(!s.book.includes(s.form))s.book.push(s.form);say('进化啦！'+s.name+' 长成了'+formName()+'！')}}function formName(){return {'🐱':'奶油猫','🦊':'星光狐','🦉':'月亮枭'}[s.form]||''}function face(){return ['🥚','🐣','🐥',s.form||'🐱'][stage()]}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{$('message').textContent='浏览器未允许保存，请保持页面开启。'}}function tick(){let now=Date.now(),m=Math.min((now-s.last)/60000,480);s.last=now;s.food=clamp(s.food-m*.22);s.joy=clamp(s.joy-m*.12);s.clean=clamp(s.clean-m*.15);s.energy=clamp(s.energy+m*(s.sleeping?.8:-.12));if(s.energy>=100)s.sleeping=false;save();render()}function say(t){$('message').textContent=t}function render(){evolve();$('name').textContent=s.name;$('coins').textContent='✦ '+s.coins;$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('age').textContent=['等待孵化','幼年期','成长期',formName()+' · 成熟期'][stage()]+' · 相伴 '+Math.floor((Date.now()-s.born)/86400000)+' 天';$('pet').textContent=face();$('pet').classList.toggle('sleep',s.sleeping);$('bubble').textContent=s.sleeping?'Zzz… 做个甜甜的梦':stage()===0?'摸摸我，快要孵化啦':s.food<30?'肚子咕噜咕噜…':s.clean<30?'想洗个香香的澡':'今天也喜欢你 ♡';$('dirt').textContent=s.clean<40?'💩':'';$('stats').innerHTML=config.map(([k,n,i,c])=>`<div class="stat"><div class="statline"><span>${i} ${n}</span><span>${Math.round(s[k])}/100</span></div><div class="track"><div class="fill" style="width:${s[k]}%;background:${c}"></div></div></div>`).join('');$('selection').textContent=acts[selected][1]+' · 按中键使用';document.querySelectorAll('.action').forEach((b,i)=>{b.disabled=s.sleeping&&i!==3;b.style.outline=i===selected?'2px solid #d8abc6':'none'});if(tab==='growth'){$('detail').textContent=stage()===3?'已经长大啦！多玩耍容易成为星光狐，常休息容易成为月亮枭，偏爱美食会成为奶油猫。':'成长值 '+s.xp+' / '+[5,45,120][stage()]+'。照顾、陪玩都能成长。多玩耍、喂食或睡觉，会影响最终形态。';$('evolution').innerHTML=['🥚','🐣','🐥',s.form||'❔'].map((x,i)=>`<div><span class="${i<=stage()?'unlocked':''}">${x}</span><small>${['宠物蛋','幼年','成长','进化'][i]}</small></div>`).join('')}else{$('detail').textContent='三种原创进化形态 · 已发现 '+s.book.length+'/3';$('evolution').innerHTML=['🐱','🦊','🦉'].map(x=>`<div><span class="${s.book.includes(x)?'unlocked':''}">${x}</span><small>${{'🐱':'奶油猫 · 喂食','🦊':'星光狐 · 玩耍','🦉':'月亮枭 · 睡觉'}[x]}</small></div>`).join('')}}function action(i){tick();if(s.sleeping&&i!==3)return say('它在睡觉，按“睡觉”可以叫醒它。');if(i===0){if(s.coins<3)return say('星币不够啦，玩接星星可以赚星币。');if(s.food>95)return say('已经吃饱啦，先玩一会儿吧。');s.coins-=3;s.food=clamp(s.food+22);s.feeds++;s.xp+=4;say('啊呜！吃了一颗香香的饭团。')}if(i===1){if(s.clean>95)return say('已经香香的啦！');s.clean=clamp(s.clean+35);s.xp+=3;say('泡泡咕噜咕噜，洗得干干净净。')}if(i===2){if(stage()===0)return say('先摸摸蛋，让小家伙孵化吧。');if(s.energy<15)return say('有点累了，先睡一会儿吧。');return startGame()}if(i===3){if(stage()===0)return say('蛋宝宝正在休息，摸摸它就能孵化。');s.sleeping=!s.sleeping;if(s.sleeping){s.sleeps++;s.xp+=2}say(s.sleeping?'灯光调暗，晚安，小家伙。':'早上好！又是元气满满的一天。')}if(i===4){if(Math.min(s.food,s.clean,s.energy)>=40)return say('它很健康！继续照顾就好。');if(s.coins<5)return say('照料需要 5 星币，玩游戏可以赚星币。');s.coins-=5;s.food=clamp(s.food+15);s.clean=clamp(s.clean+15);s.energy=clamp(s.energy+15);s.xp+=2;say('细心照料后，它感觉好多了。')}if(i===5){s.joy=clamp(s.joy+5);if(stage()===0){s.xp++;say(s.xp>=5?'咔嚓！小宝宝破壳而出了！':'蛋壳动了一下…再摸摸它吧。')}else{let now=Date.now();if(now-(s.patAt||0)>60000){s.xp++;s.patAt=now}say('蹭蹭你的手心，喜欢你！')}}evolve();save();render()}function move(){let target=$('target');target.style.left=Math.random()*70+'%';target.style.top=Math.random()*68+'%'}function startGame(){score=0;remaining=15;$('gameinfo').textContent='剩余 15 秒 · 接住 0 颗';$('game').showModal();move();timer=setInterval(()=>{remaining--;$('gameinfo').textContent='剩余 '+remaining+' 秒 · 接住 '+score+' 颗';if(remaining<=0)endGame()},1000)}function endGame(){if(!timer)return;clearInterval(timer);timer=null;$('game').close();let reward=Math.min(score,25);s.coins+=reward;s.joy=clamp(s.joy+Math.min(score*3,35));s.energy=clamp(s.energy-10);s.food=clamp(s.food-6);s.clean=clamp(s.clean-5);if(score){s.plays++;s.xp+=Math.min(score,12)}say('接到 '+score+' 颗星星，获得 '+reward+' 星币！');save();render()}$('target').onclick=()=>{score++;move();$('gameinfo').textContent='剩余 '+remaining+' 秒 · 接住 '+score+' 颗'};$('gameClose').onclick=endGame;$('game').addEventListener('cancel',e=>{e.preventDefault();endGame()});$('actions').innerHTML=acts.map(([i,n],k)=>`<button class="action" data-action="${k}"><b>${i}</b>${n}</button>`).join('');$('actions').onclick=e=>{let b=e.target.closest('button');if(b){selected=+b.dataset.action;action(selected)}};$('pet').onclick=()=>action(5);$('pet').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(5)}};$('prev').onclick=()=>{selected=(selected+5)%6;render()};$('next').onclick=()=>{selected=(selected+1)%6;render()};$('confirm').onclick=()=>action(selected);$('rename').onclick=()=>{let n=prompt('给小伙伴起个名字吧',s.name);if(n&&n.trim()){s.name=n.trim().slice(0,12);save();render()}};for(const [id,t]of[['tabGrowth','growth'],['tabBook','book']])$(id).onclick=()=>{tab=t;$('tabGrowth').classList.toggle('active',tab==='growth');$('tabBook').classList.toggle('active',tab==='book');render()};tick();setInterval(tick,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script></body></html>
