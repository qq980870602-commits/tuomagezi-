</style></head><body><main class="app"><header class="top"><div class="logo">口袋星球 <small>FOREST LETTERS · VOL.02</small></div><div class="tools"><button class="ghost" id="sound" aria-label="音效开关">♫ 关</button><button class="ghost" id="settings">⚙</button></div></header><div class="journal"><div><h1 id="petname">一封来自森林的信</h1><p id="subtitle">第 1 代 · 新的相遇</p></div><div class="tag" id="wallet">✦ 80</div></div><section class="machine"><div class="screen"><div class="screenbar"><span id="location">🌿 林间小屋</span><span id="clock"></span></div><canvas id="world" width="320" height="224" aria-label="宠物房间，点击宠物互动" role="button" tabindex="0"></canvas><div class="speech" id="speech" aria-live="polite">这颗蛋里，住着怎样的小家伙呢？</div></div><div class="machinefoot"><span>POCKET PLANET</span><span class="led"></span><span id="weather">FOREST EDITION</span></div></section><section class="stats" id="stats"></section><nav class="nav" id="nav"></nav><section id="content"></section><footer class="footer">一只小宠物，一个慢慢生长的世界 · 离线存档</footer></main><dialog id="modal"></dialog><input type="file" accept="application/json" id="file"><script>
'use strict';
const $=id=>document.getElementById(id),KEY='pocket-forest-v2',DAY=86400000;const FORMS=[{id:'leaf',name:'苔叶精灵',desc:'偏爱照料，生活规律',color:'#99bb72',ears:0},{id:'fox',name:'落日小狐',desc:'最爱游戏，活泼好动',color:'#e4a06b',ears:1},{id:'owl',name:'月夜团子',desc:'喜欢休息，安静温柔',color:'#aea0d1',ears:2},{id:'cloud',name:'奶油云朵',desc:'爱吃美食，软乎乎的',color:'#ebd7a7',ears:3},{id:'star',name:'星冠精灵',desc:'均衡照顾，保持健康',color:'#f3d17e',ears:4},{id:'moss',name:'旅行苔球',desc:'热爱远行，勇敢好奇',color:'#77b7aa',ears:5}];const FOOD=[{id:'rice',name:'森林饭团',icon:'🍙',price:5,food:28,joy:2},{id:'berry',name:'野莓布丁',icon:'🍮',price:9,food:18,joy:18},{id:'soup',name:'南瓜浓汤',icon:'🥣',price:14,food:42,joy:8}];const ROOMS=[{id:'forest',name:'林间小屋',icon:'🌿',price:0},{id:'sea',name:'海风小屋',icon:'🐚',price:90},{id:'night',name:'星月阁楼',icon:'🌙',price:150}];const HATS=[{id:'none',name:'原本的你',icon:'◌',price:0},{id:'flower',name:'小花发夹',icon:'🌼',price:35},{id:'crown',name:'生日王冠',icon:'👑',price:100},{id:'bow',name:'莓果蝴蝶结',icon:'🎀',price:50}];const fresh=()=>({v:2,name:'小芽',born:Date.now(),last:Date.now(),generation:1,food:78,joy:75,clean:85,energy:85,health:100,bond:0,xp:0,coins:80,care:0,feeds:0,plays:0,rests:0,trips:0,form:null,hat:'none',room:'forest',owned:['forest','none'],book:[],family:[],bag:{rice:4,berry:1,soup:0},sleep:false,trip:null,records:[],totalGames:0,totalStars:0,daily:{date:'',care:0,play:0,trip:0,claimed:[]},sound:false,lastPat:0,lastRest:0,lastWash:0});let s=fresh(),storageError=false;try{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.v===2)s={...fresh(),...old};else{let p=JSON.parse(localStorage.getItem('pocket-planet-v1')||'null');if(p){s.name=p.name||s.name;s.coins=p.coins||80;s.food=p.food??78;s.joy=p.joy??75;s.clean=p.clean??85;s.energy=p.energy??85;s.xp=Math.min(140,p.xp||0)}}}catch{}let tab='care',scene='idle',sceneUntil=0,particles=[],toastTimer=null,game=null,lastFrame=0,worldFrame=0;const canvas=$('world'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const clamp=n=>Math.max(0,Math.min(100,n)),stage=()=>s.xp<5?0:s.xp<65?1:s.xp<180?2:3,stageNames=['宠物蛋','幼年期','成长期','成熟期'];function save(){try{localStorage.setItem(KEY,JSON.stringify(s));storageError=false}catch{storageError=true;notify('保存失败，请到设置中复制存档备份。')}}function daily(){const d=new Date().toLocaleDateString('sv-SE');if(s.daily.date!==d)s.daily={date:d,care:0,play:0,trip:0,claimed:[]}}function note(t){s.records.unshift({at:Date.now(),text:t});s.records=s.records.slice(0,30)}function say(t){$('speech').textContent=t}function notify(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3200)}let audio;function beep(kind=0){if(!s.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=kind?660:440;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.currentTime+.2)}catch{}}function animate(kind,text){try{if(window.webkit?.messageHandlers?.haptic)window.webkit.messageHandlers.haptic.postMessage('tap');else if(navigator.vibrate)navigator.vibrate(15)}catch{}scene=kind;sceneUntil=Date.now()+3500;if(text)say(text);for(let i=0;i<7;i++)particles.push({x:150+Math.random()*25,y:120,v:-.5-Math.random(),life:75,color:['#f9d97b','#f2a8a1','#fff5ce'][i%3]});beep(1)}function pickForm(){if(s.health>85&&Math.min(s.food,s.clean,s.joy)>65&&s.care>=8&&s.plays>=3&&s.trips>=2)return 'star';if(s.trips>=5)return 'moss';if(s.plays>s.feeds&&s.plays>s.rests)return 'fox';if(s.rests>s.feeds)return 'owl';if(s.feeds>s.care)return 'cloud';return 'leaf'}function evolve(old){let current=stage();if(current!==old){if(current===3){s.form=pickForm();if(!s.book.includes(s.form))s.book.push(s.form)}let t=current===1?'咔嚓！'+s.name+' 破壳而出了！':current===2?s.name+' 长大了一点！':s.name+' 进化成了'+FORMS.find(f=>f.id===s.form).name+'！';note(t);animate('evolve',t);notify(t)}}function grow(n){let old=stage();s.xp+=n;evolve(old)}function tick(){daily();let now=Date.now(),m=Math.max(0,Math.min((now-s.last)/60000,480));s.last=now;s.food=clamp(s.food-m*.28);s.joy=clamp(s.joy-m*.16);s.clean=clamp(s.clean-m*.19);s.energy=clamp(s.energy+m*(s.sleep?.9:-.14));if(s.sleep&&s.energy>=100)s.sleep=false;let needs=Math.min(s.food,s.clean,s.energy);s.health=clamp(s.health+m*(needs<15?-.15:needs>50?.035:0));if(stage()>0&&needs>25)grow(Math.min(m*.18,35));if(s.trip&&now>=s.trip.end){let trip=s.trip;s.trip=null;s.trips++;s.daily.trip++;s.coins+=trip.reward;s.energy=clamp(s.energy-12);s.food=clamp(s.food-10);s.bond=clamp(s.bond+4);grow(trip.xp);note('从'+trip.name+'回来，带回 '+trip.reward+' 星币');animate('happy','旅行归来！带回 '+trip.reward+' 星币与一片风景。');notify('探索完成：+'+trip.reward+' 星币')}save();render()}
function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tile(action,icon,name,sub='',extra=''){return `<button class="tile ${extra}" data-act="${action}"><b>${icon}</b><strong>${name}</strong><small>${sub}</small></button>`}function render(){ $('petname').textContent=s.name;$('subtitle').textContent='第 '+s.generation+' 代 · '+stageNames[stage()]+' · 亲密 '+Math.round(s.bond);$('wallet').textContent='✦ '+s.coins;$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('location').textContent=(s.trip?'✉ '+s.trip.name:ROOMS.find(x=>x.id===s.room)?.icon+' '+ROOMS.find(x=>x.id===s.room)?.name)||'林间小屋';$('sound').textContent=s.sound?'♫ 开':'♫ 关';$('stats').innerHTML=[['food','饱腹','#d9bb7d'],['joy','心情','#db9b9e'],['clean','清洁','#8fc5bc'],['energy','精力','#b6a1cb']].map(([k,n,c])=>`<div class="stat"><small><span>${n}</span><span>${Math.round(s[k])}</span></small><div class="track"><div class="fill" style="width:${s[k]}%;background:${c}"></div></div></div>`).join('');$('nav').innerHTML=[['care','照料'],['play','游乐'],['shop','商店'],['growth','成长'],['book','手册']].map(([id,n])=>`<button class="${id===tab?'on':''}" data-tab="${id}">${n}</button>`).join('');let h='';if(tab==='care'){h='<div class="grid">'+tile('food','🍙','开饭啦','背包里有 '+Object.values(s.bag).reduce((a,b)=>a+b,0)+' 份食物')+tile('wash','🫧','泡泡浴','洗净小烦恼')+tile('sleep','🌙',s.sleep?'轻轻叫醒':'盖好被子','休息恢复精力')+tile('pat','♡','摸摸脑袋','靠近一点点')+tile('heal','🌱','草药护理','健康 '+Math.round(s.health)+' · 15✦')+tile('dress','🎨','布置小屋','房间与小装饰')+'</div>';h+='<div class="section">今天的小约定</div>';const tasks=[['care','照料 3 次',3,15],['play','完成 2 场游戏',2,20],['trip','探索 1 次',1,20]];h+=tasks.map(([id,n,target,reward])=>`<div class="card row"><div><strong style="font-size:12px">${n}</strong><p>${Math.min(s.daily[id],target)} / ${target} · 奖励 ${reward}✦</p></div><button class="button" data-act="claim:${id}" ${s.daily[id]<target||s.daily.claimed.includes(id)?'disabled':''}>${s.daily.claimed.includes(id)?'已领取':'领取'}</button></div>`).join('')}if(tab==='play'){h='<div class="card"><h3>小小游乐场</h3><p>消耗精力，收获星币与成长。每场都有奖励上限。</p></div><div class="grid">'+tile('game:stars','✦','星光接接乐','滑动接星星')+tile('game:memory','▦','森林翻翻卡','找齐四对伙伴')+tile('game:fish','🎣','湖边钓鱼','瞄准绿色区域')+'</div><div class="section">寄一张远方的明信片</div>';h+=[['trail','蘑菇小径',2,18,9],['lake','萤火湖畔',5,30,15],['peak','星光山顶',10,48,24]].map(([id,n,min,reward,xp])=>`<div class="card row"><div><h3>${n}</h3><p>${min} 分钟 · ${reward}✦ · 成长 +${xp}</p></div><button class="button" data-act="trip:${id}" ${s.trip?'disabled':''}>${s.trip?'探索中':'出发'}</button></div>`).join('');if(s.trip)h+='<p class="muted">已出发：'+s.trip.name+' · 约 '+Math.max(1,Math.ceil((s.trip.end-Date.now())/60000))+' 分钟后返回。关闭应用也会计时。</p>'}if(tab==='shop'){h='<div class="section">今日食堂</div><div class="grid">'+FOOD.map(f=>tile('buyFood:'+f.id,f.icon,f.name,f.price+'✦ · 饱腹 +'+f.food)).join('')+'</div><div class="section">换个地方做梦</div><div class="grid">'+ROOMS.map(r=>tile('buyRoom:'+r.id,r.icon,r.name,s.owned.includes(r.id)?s.room===r.id?'正在使用':'已拥有 · 使用':r.price+'✦',s.room===r.id?'selected':'')).join('')+'</div><div class="section">一点小小打扮</div><div class="grid">'+HATS.map(x=>tile('buyHat:'+x.id,x.icon,x.name,s.owned.includes(x.id)?s.hat===x.id?'已佩戴':'已拥有 · 佩戴':x.price+'✦',s.hat===x.id?'selected':'')).join('')+'</div>'}if(tab==='growth'){let next=[5,65,180][stage()];h='<div class="card"><div class="row"><h3>'+stageNames[stage()]+'</h3><span class="badge">健康 '+Math.round(s.health)+'</span></div><p>'+ (next?'成长 '+Math.floor(s.xp)+' / '+next:'已进化为 '+(FORMS.find(f=>f.id===s.form)?.name||'森林精灵'))+'</p><div class="progress"><div style="width:'+Math.min(100,s.xp/(next||180)*100)+'%"></div></div><p>照顾、玩耍、探索都会成长；在线和离线时间也会缓慢积累成长。</p></div>';h+='<div class="card"><h3>每一次陪伴，都改变未来</h3><p>照料 '+s.care+' · 喂食 '+s.feeds+' · 游戏 '+s.plays+' · 休息 '+s.rests+' · 探索 '+s.trips+'</p><p>均衡照顾可遇见稀有形态，最常做的事会影响进化。成长期后可在图鉴查看线索。</p></div>';h+='<div class="card"><h3>下一封森林来信</h3><p>成熟、亲密度达到 60 后，可以与森林伙伴结伴。上一代留在纪念册，新一代继承星币、家具和图鉴。</p><button class="button" data-act="nextgen" '+(stage()<3||s.bond<60?'disabled':'')+'>结伴 · 迎接下一代</button></div>';h+=s.family.slice().reverse().map(f=>'<div class="family"><strong>第 '+f.generation+' 代 · '+escapeHTML(f.name)+'</strong><p class="muted">'+escapeHTML(f.form)+' · 相伴 '+Math.max(1,Math.ceil((f.end-f.born)/DAY))+' 天</p></div>').join('')}if(tab==='book'){h='<div class="section">森林居民图鉴 · '+s.book.length+' / 6</div>';h+=FORMS.map(f=>'<div class="card row"><div><h3>'+(s.book.includes(f.id)?'✦ '+f.name:'？ 未邂逅的伙伴')+'</h3><p>'+f.desc+'</p></div><span class="badge">'+(s.book.includes(f.id)?'已发现':'待发现')+'</span></div>').join('');h+='<div class="section">我们的日记</div>';h+=s.records.slice(0,8).map(r=>'<div class="card"><small class="muted">'+new Date(r.at).toLocaleString('zh-CN')+'</small><p>'+escapeHTML(r.text)+'</p></div>').join('')||'<p class="muted">从破壳的那一刻，故事开始被记下。</p>'}$('content').innerHTML=h}
function available(){if(s.trip){say('它还在旅行，等它带明信片回来吧。');return false}if(s.sleep){say('小家伙睡着了，先轻轻叫醒它。');return false}return true}function careCount(){s.care++;s.daily.care++;s.bond=clamp(s.bond+3)}function openModal(title,body){$('modal').innerHTML='<h2>'+title+'</h2>'+body+'<div class="modalbuttons"><button class="ghost" data-act="close">关闭</button></div>';$('modal').showModal()}function action(a){const [kind,id]=a.split(':');daily();if(kind==='close'){endGame(false);$('modal').close();return}if(kind==='claim'){const n={care:3,play:2,trip:1}[id],reward={care:15,play:20,trip:20}[id];if(n&&s.daily[id]>=n&&!s.daily.claimed.includes(id)){s.daily.claimed.push(id);s.coins+=reward;notify('完成今日约定！+'+reward+'✦')}}else if(kind==='food'){if(!available())return;openModal('开饭啦','<p class="muted">吃饱就不勉强，选择背包中的食物。</p><div class="grid">'+FOOD.map(f=>tile('eat:'+f.id,f.icon,f.name,'剩余 '+(s.bag[f.id]||0)+' 份')).join('')+'</div>');return}else if(kind==='eat'){if(!available())return;let f=FOOD.find(f=>f.id===id);if(!f)return;if(!s.bag[id])return notify('没有了，去商店补充一点吧');if(s.food>92)return notify('肚子已经圆滚滚，晚点再吃吧');s.bag[id]--;s.food=clamp(s.food+f.food);s.joy=clamp(s.joy+f.joy);s.feeds++;careCount();grow(5);$('modal').close();animate('eat','啊呜，'+f.name+' 真好吃！')}else if(kind==='wash'){if(!available())return;if(s.clean>94)return notify('已经干净啦，晚点再洗');s.clean=100;s.health=clamp(s.health+4);careCount();grow(4);animate('wash','泡泡咕噜咕噜，把烦恼都洗掉。')}else if(kind==='sleep'){if(s.trip)return notify('还在旅行中');if(stage()===0)return notify('摸摸蛋，让它先破壳吧');s.sleep=!s.sleep;if(s.sleep&&Date.now()-s.lastRest>300000){s.rests++;s.lastRest=Date.now();careCount();grow(3)}say(s.sleep?'关灯，盖好被子。祝你梦见星星。':'醒来啦！今天也一起冒险吧。')}else if(kind==='pat'){if(!available())return;if(stage()===0){grow(1);animate('pat',stage()===0?'蛋里传来小小的回应…再摸摸看。':$('speech').textContent)}else{if(Date.now()-s.lastPat>20000){s.bond=clamp(s.bond+3);s.joy=clamp(s.joy+3);s.lastPat=Date.now();grow(1)}animate('happy','蹭蹭你的手心，喜欢你。')}}else if(kind==='heal'){i let gx=null,gameRAF=null,gameInterval=null;function startGame(type){game={type,score:0,start:performance.now(),remaining:type==='memory'?45:20,ended:false};openModal(type==='stars'?'星光接接乐':type==='memory'?'森林翻翻卡':'湖边钓鱼','<p class="muted" id="gamehint">'+(type==='stars'?'左右拖动篮子，接住星星，避开雨滴。':type==='memory'?'翻开卡片，找到相同伙伴，45 秒内完成。':'绿色区域出现时按下收竿，20 秒内尽量多钓几条。')+'</p><div class="row"><span id="gscore">得分 0</span><span id="gtime">'+game.remaining+'s</span></div>'+(type==='memory'?'<div class="memory" id="memory"></div>':'<canvas class="gamecanvas" id="minigame" width="320" height="230"></canvas>')+(type==='fish'?'<button style="width:100%;margin-top:12px" class="button" id="fishhit">收竿！</button>':''));if(type==='memory'){let cards=['🌿','🍄','🌙','🌼','🌿','🍄','🌙','🌼'];for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}game.cards=cards;game.open=[];game.found=[];game.lock=false;$('memory').innerHTML=cards.map((v,i)=>`<button data-card="${i}" aria-label="翻开第 ${i+1} 张">✦</button>`).join('');$('memory').onclick=e=>{let b=e.target.closest('[data-card]');if(!b||!game||game.lock)return;let i=+b.dataset.card;if(game.found.includes(i)||game.open.includes(i))return;game.open.push(i);b.textContent=game.cards[i];beep();if(game.open.length===2){let [a,c]=game.open;if(game.cards[a]===game.cards[c]){game.found.push(a,c);game.open=[];game.score+=3;$('gscore').textContent='得分 '+game.score;if(game.found.length===8)endGame(true)}else{game.lock=true;setTimeout(()=>{if(!game||game.type!=='memory')return;game.open.forEach(i=>{$('memory').querySelector(`[data-card="${i}"]`).textContent='✦'});game.open=[];game.lock=false},650)}}}}else{gx=$('minigame').getContext('2d');game.x=160;game.items=[];game.next=0;game.last=performance.now();game.marker=0;game.cooldown=0;$('minigame').onpointerdown=e=>{if(type==='stars'){e.currentTarget.setPointerCapture(e.pointerId);game.x=(e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.client lRect(game.marker-3,24,6,34)}gameRAF=requestAnimationFrame(drawGame)}function endGame(reward){if(!game)return;let g=game;game=null;clearInterval(gameInterval);cancelAnimationFrame(gameRAF);if(reward){let points=Math.min(g.score,30),coins=Math.max(2,points*2),xp=Math.max(2,Math.min(points,15));s.coins+=coins;s.totalGames++;s.totalStars+=points;s.daily.play++;s.plays++;s.energy=clamp(s.energy-12);s.food=clamp(s.food-7);s.clean=clamp(s.clean-6);s.joy=clamp(s.joy+15+points);s.bond=clamp(s.bond+5);grow(xp);note('完成'+({stars:'接星星',memory:'翻翻卡',fish:'钓鱼'}[g.type])+'，获得 '+coins+'✦');$('modal').innerHTML='<h2>这段时光，闪闪发亮</h2><p>得分 '+g.score+' · 星币 +'+coins+' · 成长 +'+xp+'</p><p class="muted">心情和亲密度也提升了。休息一下，再来玩吧。</p><div class="modalbuttons"><button class="button" data-act="close">带奖励回家</button></div>';animate('happy','玩得好开心！我们赚到了 '+coins+' 星币。');save();render()}}

x(c,i,-67,8,10,'#edcf72')}if(s.hat==='bow'){px(c,-27,-49,12,11,'#bc737d');px(c,-10,-49,12,11,'#bc737d');px(c,-17,-45,9,6,'#de9c9e')}if(scene==='eat'){px(c,15,-12,20,17,'#fff0cd');px(c,21,-4,8,9,'#5e765b')}if(sleep){px(c,-33,-4,67,18,'#7b99a2');px(c,-27,-4,56,4,'#bad0c2');c.fillStyle='#edf0cd';c.font='12px monospace';c.fillText('z Z',22,-45)}c.restore()}
function drawWorld(t){worldFrame++;let room=s.room,isNight=s.sleep||room==='night',sea=room==='sea',sky=isNight?'#304858':sea?'#acd0c7':'#bdd1ad',wall=isNight?'#3d535b':sea?'#d4e0c5':'#dce0ba';ctx.fillStyle=wall;ctx.fillRect(0,0,320,224);px(ctx,0,0,320,8,isNight?'#293e4d':'#c0cba4');for(let i=0;i<320;i+=40)px(ctx,i,8,2,152,isNight?'#435c5f':'#cdd3aa');px(ctx,0,157,320,67,isNight?'#526157':'#b4ad85');for(let j=0;j<4;j++){for(let i=0;i<8;i++){px(ctx,i*44+(j%2?22:0),161+j*17,1,15,'#8d967154')}px(ctx,0,160+j*17,320,1,isNight?'#687263':'#9ba07c')}px(ctx,19,24,91,103,'#708b78');px(ctx,24,29,81,92,sky);if(isNight){star(ctx,43,48,3,'#eee4b2');star(ctx,86,62,2,'#eee4b2');px(ctx,65,39,16,17,'#f4e6a7');px(ctx,72,36,13,14,sky)}else{px(ctx,79,38,14,14,'#f3d89c');px(ctx,26,92,77,28,sea?'#6da6aa':'#84ab82');for(let i=0;i<5;i++)px(ctx,27+i*18,86+(i%2)*9,18,10,sea?'#8bbebb':'#a4bc8a')}px(ctx,61,29,5,92,'#e9e4c0');px(ctx,24,78,81,5,'#e9e4c0');px(ctx,15,122,100,6,'#8a9c78');px(ctx,245,44,51,7,'#8c9774');px(ctx,251,29,9,15,'#d3a589');px(ctx,264,25,11,19,'#9cae8c');px(ctx,279,31,10,13,'#d4c397');px(ctx,265,142,28,25,'#b08c6c');px(ctx,263,137,32,6,'#d6b08a');px(ctx,276,107,5,30,'#6d8f66');px(ctx,259,115,19,9,'#7fa175');px(ctx,281,104,17,12,'#91b47b');px(ctx,66,180,179,25,isNight?'#7c8b78':'#c7c5a1');px(ctx,76,184,159,17,isNight?'#8b987d':'#dad4af');if(s.clean<35){px(ctx,225,170,12,8,'#8c7358');px(ctx,228,166,6,5,'#8c7358')}if(s.trip){ctx.fillStyle=isNight?'#9fbaa9':'#76907a';ctx.font='11px monospace';ctx.fillText('ON A LITTLE ADVENTURE',83,157);px(ctx,141,116,36,28,'#e4d8b0');px(ctx,144,119,30,2,'#bc9e7a')}else{let x=160+(!s.sleep&&scene==='idle'?Math.sin(t/2200)*24:0);px(ctx,x-26,181,52,5,'#75846840');petDraw(ctx,x,179,t)}if(scene==='wash'&&!s.trip){for(let i=0;i<12;i++){let x=120+Math.sin(t/600+i)*44,y=150-((t/22+i*11)%85);ctx.strokeStyle='#eef8d6';ctx.lineWidth=2;ctx.strokeRect(Math.round(x),Math.round(y),6+i%3*3,6+i%3*3)}}if(scene==='evolve'){for(let i=0;i<10;i++)star(ctx,160+Math.sin(i+t/500)*65,135+Math.cos(i+t/500)*45,3,'#fbf0ad')}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.y+=p.v;p.life--;star(ctx,p.x,p.y,2,p.color);if(p.life<0)particles.splice(i,1)}if(Date.now()>sceneUntil)scene='idle';requestAnimationFrame(drawWorld)}
function exportSave(){let text=JSON.stringify(s),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='PocketPlanet-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);$('saveText').value=text;notify('也可全选下方文字复制备份')}function settings(){openModal('把故事好好收藏','<p class="muted">当前版本 2.0 · 森林来信<br>存档只在本设备；卸载前请复制备份。</p><input id="newname" maxlength="12" placeholder="给它一个名字"><button class="button" data-act="rename">保存名字</button><div class="section">存档备份与恢复</div><textarea id="saveText" style="width:100%;height:90px;background:#122b37;color:#d8e0cb;border:1px solid #5b7976;border-radius:8px;padding:8px" placeholder="点导出获得备份文字，或粘贴已有存档后恢复"></textarea><div class="modalbuttons"><button class="ghost" data-act="export">导出 / 复制</button><button class="button" data-act="import">恢复存档</button></div><p class="muted">离线最多结算 8 小时。宠物不会因离线死亡，但饥饿和清洁会影响健康。探索离线继续计时。</p>');$('newname').value=s.name}function importSave(){try{let v=JSON.parse($('saveText').value);const numeric=['food','joy','clean','energy','health','bond','xp','coins'];if(v.v!==2||typeof v.name!=='string'||!numeric.every(k=>Number.isFinite(v[k])&&v[k]>=0)||!Array.isArray(v.book)||!Array.isArray(v.owned)||!Array.isArray(v.family)||!v.bag||!v.daily)throw Error();let next={...fresh(),...v};for(let k of ['food','joy','clean','energy','health','bond'])next[k]=clamp(next[k]);next.name=next.name.slice(0,12);next.room=ROOMS.some(x=>x.id===next.room)?next.room:'forest';next.hat=HATS.some(x=>x.id===next.hat)?next.hat:'none';next.form=FORMS.some(x=>x.id===next.form)?next.form:null;s=next;save();tick();$('modal').close();notify('故事接上了，欢迎回来！')}catch{notify('存档不完整，请粘贴完整的 2.0 备份文字')}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();beep();return}let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a==='rename'){let n=$('newname').value.trim();if(n){s.name=n.slice(0,12);save();render();notify('以后就叫 '+s.name+' 啦')}}else if(a==='export')exportSave();else if(a==='import')importSave();else action(a)});$('modal').addEventListener('cancel',()=>endGame(false));$('settings').onclick=settings;$('sound').onclick=()=>{s.sound=!s.sound;save();render();beep()};canvas.onclick=()=>action('pat');canvas.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action('pat')}};document.addEventListener('visibilitychange',()=>{if(document.hidden){if(game)endGame(false);save()}else tick()});tick();if(s.trip)say('它正在探索，回来时会带一封明信片。');else if(stage()>0)say('欢迎回家。今天想一起做点什么？');requestAnimationFrame(drawWorld);setInterval(tick,10000);
